{% extends "base.html" %}
{% block title %}Book Appointment — MediCare HMS{% endblock %}
{% block page_title %}Book Appointment{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h2>Book Appointment</h2>
    <p>Schedule a new patient appointment</p>
  </div>
  <a href="{{ url_for('appointments') }}" class="btn btn-outline">← Back to Appointments</a>
</div>

<div class="card form-card">
  <div class="card-header">
    <h3>📋 Appointment Details</h3>
  </div>
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group">
          <label for="patient_id">Patient *</label>
          <select id="patient_id" name="patient_id" required>
            <option value="">Select patient</option>
            {% for p in patients %}
            <option value="{{ p.id }}" {{ 'selected' if appointment and appointment.patient_id == p.id }}>
              {{ p.name }} (ID: {{ p.id }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="doctor_id">Doctor *</label>
          <select id="doctor_id" name="doctor_id" required>
            <option value="">Select doctor</option>
            {% for d in doctors %}
            <option value="{{ d.id }}" {{ 'selected' if appointment and appointment.doctor_id == d.id }}>
              {{ d.name }} — {{ d.specialization }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="appt_date">Date *</label>
          <input type="date" id="appt_date" name="appt_date" required
                 value="{{ appointment.appt_date if appointment else '' }}">
        </div>
        <div class="form-group">
          <label for="appt_time">Time *</label>
          <input type="time" id="appt_time" name="appt_time" required
                 value="{{ appointment.appt_time if appointment else '' }}">
        </div>
        <div class="form-group form-full">
          <label for="reason">Reason / Symptoms</label>
          <textarea id="reason" name="reason" rows="3"
                    placeholder="Describe the reason for visit...">{{ appointment.reason if appointment else '' }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Book Appointment</button>
        <a href="{{ url_for('appointments') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
